<div class="card-container">
    <div class="answer">{{Mặt sau}}</div>

    <div class="answer" id="jpAnswer"></div>
</div>

<script>
    (function () {

        const raw = `{{Mặt trước}}`;

        const html = raw
            .split(";")
            .map(item => {

                item = item.trim();

                const match = item.match(/^(.*?)\((.*?)\)\/(.*)$/);

                // không match thì giữ nguyên
                if (!match) {
                    return item;
                }

                const kanji = match[1].trim();
                const hira = match[2].trim();
                const roma = match[3].trim();

                return `
                <div class="jp-item">
                    <ruby>
                        ${kanji}
                        <rt>${hira}</rt>
                    </ruby>

                    <div class="roma">
                        ${roma}
                    </div>
                </div>
            `;
            })
            .join("<hr />");

        document.getElementById("jpAnswer").innerHTML = html;

    })();
</script>
