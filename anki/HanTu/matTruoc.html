<div class="card-container">

    <!-- Hiển thị đáp án (ẩn/hiện tùy logic Anki) -->
    <div class="answer">{{Mặt sau}}</div>

    <!-- Typing của Anki -->
    <div class="typing">
        {{type:Mặt trước}}
    </div>

    <!-- Input custom -->
    <div class="custom-input">
        <input id="myInput" placeholder="Nhập..." />

        <div id="result"></div>
        <div id="hint"></div>
        <div class="buttons">
            <button id="submitBtn">Submit</button>
            <button id="showBtn">Gợi ý</button>
        </div>
        <div class="checkboxes">
            <label><input type="checkbox" id="cbDateMode"> Date Mode</label>
        </div>
    </div>
    <div id="logBox"></div>
</div>

<style>
    .buttons {
        display: flex;
    }

    #logBox {
        width: 100%;
        height: 200px;
        border: 1px solid #ccc;
        padding: 10px;
        overflow-y: auto;
        background: #111;
        color: #0f0;
        font-family: monospace;
        text-align: left;
        font-size: 12px;
    }
</style>

<script>
    var raw = `{{Mặt trước}}`.replace(/\n/g, " ");
    var cardKey = encodeURIComponent(raw);
    var fail = 0;
    var isFirst = true;
    var isShowingAnswer = false;

    function XuatLog(type = 0, ...message) {
        var logBox = document.getElementById("logBox");
        if (!logBox) return;

        var color = "#0f0";
        switch (type) {
            case 1: color = "#ff0"; break; // warning
            case 2: color = "#f00"; break; // error
        }
        var time = "";
        message.forEach(line => {
            time = new Date().toLocaleTimeString();
            logBox.innerHTML = `<span style="color: ${color}">[${time}] ${line}</span><br>` + logBox.innerHTML;
        });
    }

    function XuatLogHam(fn) {
        return function (...args) {
            var cauTinNhan = `Gọi hàm ${fn.name} với tham số: ${JSON.stringify(args)}`;
            try {
                const result = fn(...args);
                cauTinNhan += `<br/>Hàm ${fn.name} trả về: ${JSON.stringify(result)}`;
                XuatLog(0, cauTinNhan);
                return result;
            } catch (error) {
                XuatLog(2, `Lỗi trong hàm ${fn.name}: ${error}`);
                throw error;
            }
        };
    }

    var TaoNgay = XuatLogHam(function taoNgay(start = new Date(), end = new Date()) {
        return new Date(
            start.getTime() +
            Math.random() *
            (end.getTime() - start.getTime())
        );
    });

    function Normalize(s) {
        try {
            return s.toLowerCase().replace(/\s+/g, "");
        } catch (error) {
            XuatLog(2, "Error in Normalize:" + error);
            throw error;
        }
    }

    function containsJapanese(text) {
        try {
            return /[ぁ-んァ-ン一-龯]/.test(text);
        } catch (error) {
            XuatLog(2, "Error in containsJapanese:" + error);
            throw error;
        }
    }

    function containsKanji(text) {
        try {
            return /[一-龯]/.test(text);
        } catch (error) {
            XuatLog(2, "Error in containsKanji:" + error);
            throw error;
        }
    }

    var parseAnswers = XuatLogHam(function parseAnswers(str) {
        try {
            return str.split(";").map(x => {

                x = x.trim();

                // format:
                // 試験で問われる(しけんでとわれる)/siken de towareru

                const match = x.match(/^(.*?)\((.*?)\)\/(.*)$/);

                if (match) {
                    return {
                        kanji: match[1].trim(),
                        hira: match[2].trim(),
                        roma: match[3].trim()
                    };
                }

                // chỉ có kanji
                return {
                    kanji: x,
                    hira: x,
                    roma: x
                };
            });
        }
        catch (error) {
            XuatLog(2, "Error in parseAnswers:" + error);
            throw error;
        }
    });

    var answers = parseAnswers(raw);

    var isCorrect = XuatLogHam(function isCorrect(input = "", answers = "") {
        try {
            const parts = input.split(";")
                .map(x => x.trim())
                .filter(Boolean);

            if (parts.length !== answers.length) return false;

            const NormalizedInput = parts.map(x => Normalize(x)).sort();

            const NormalizedAnswers = answers.map((ans, i) => {

                const user = parts[i];

                // 🔥 nhập kanji
                if (containsKanji(user)) {
                    return Normalize(ans.kanji);
                }

                // 🔥 nhập hiragana
                if (containsJapanese(user)) {
                    return Normalize(ans.hira);
                }

                // 🔥 nhập romaji
                return Normalize(ans.roma);

            }).sort();

            return NormalizedInput.every((p, i) => p === NormalizedAnswers[i]);
        }
        catch (error) {
            XuatLog(2, "Error in isCorrect:" + error);
            throw error;
        }
    });

    var generateMask = XuatLogHam(function generateMask(user, correct) {
        try {
            const u = Normalize(user); // vd: "ha"
            const chars = new Set(u.split("")); // {h, a}

            let result = "";

            for (let ch of correct) {

                // giữ khoảng trắng
                if (ch === " ") {
                    result += " ";
                    continue;
                }

                // nếu ký tự nằm trong user input → hiện
                if (chars.has(Normalize(ch))) {
                    result += `<span class="correct">${ch}</span>`;
                } else {
                    result += `<span class="missing">_</span>`;
                }
            }

            return result;
        }
        catch (error) {
            XuatLog(2, "Error in generateMask:" + error);
            throw error;
        }
    });

    function isNoSpaceMatch(user, correct) {
        try {
            return Normalize(user) === Normalize(correct);
        }
        catch (error) {
            XuatLog(2, "Error in isNoSpaceMatch:" + error);
            throw error;
        }
    }

    function splitUserByCorrect(user, correct) {
        const u = Normalize(user);
        const words = correct.trim().split(/\s+/);
        let result = [];
        let pointer = 0;

        words.forEach(w => {
            let chunk = "";
            let i = 0;
            while (pointer < u.length && i < w.length) {
                chunk += u[pointer];
                pointer++;
                i++;
            }
            result.push(chunk);
        });

        if (pointer < u.length) {
            result[result.length - 1] += u.slice(pointer);
        }
        return result;
    }

    function countErrors(user, correct) {
        // nếu không có khoảng trắng nào → so sánh toàn bộ chuỗi
        if (isNoSpaceMatch(user, correct)) return 0;
        // nếu có khoảng trắng → tách input của user theo đáp án rồi so sánh từng phần
        const uw = splitUserByCorrect(user, correct);
        // tách đáp án đúng thành các từ riêng biệt
        const cw = correct.trim().split(/\s+/);
        // đếm tổng lỗi bằng cách tính lỗi của từng phần và cộng lại
        let total = 0;
        // duyệt qua từng phần của đáp án đúng và phần tương ứng của input của user để tính lỗi
        cw.forEach((w, i) => {
            // tính lỗi giữa phần của input của user và phần tương ứng của đáp án đúng rồi cộng vào tổng lỗi
            total += countErrorsChar(uw[i] || "", w);
        });
        // trả về tổng lỗi
        return total;
    }

    function countErrorsChar(user, correct) {
        // chuẩn hóa chuỗi để so sánh
        const u = Normalize(user);
        // chuẩn hóa chuỗi để so sánh
        const c = Normalize(correct);
        // độ dài của chuỗi user
        const m = u.length;
        // độ dài của chuỗi correct
        const n = c.length;
        // tạo bảng dp để tính LCS
        const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));

        /**
         * Tính LCS bằng quy hoạch động
         * - nếu ký tự giống nhau → tăng 1 so với LCS của 2 chuỗi trước đó
         * - nếu khác nhau → lấy max của LCS khi bỏ đi ký tự cuối của 1 trong 2 chuỗi
         */
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                if (u[i - 1] === c[j - 1]) {
                    dp[i][j] = dp[i - 1][j - 1] + 1;
                } else {
                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }
        }
        // độ dài của LCS
        const lcs = dp[m][n];
        // lỗi = tổng độ dài 2 chuỗi - 2 * LCS
        return (m - lcs) + (n - lcs);
    }

    var saveStats = XuatLogHam(function saveStats(time = new Date(), value = 0, err1 = "", err2 = "", hint = "") {
        const MAX_ATTEMPTS_PER_CARD = 20;
        // lấy dữ liệu cũ
        let stats = {};
        try {
            stats = JSON.parse(localStorage.getItem("cardStats") || "{}");
        } catch (error) {
            XuatLog(2, "Error parsing cardStats from localStorage:" + error);
        }

        // nếu chưa có dữ liệu cho card này thì khởi tạo
        if (!stats[cardKey]) {
            // attempts: mảng lưu số lần sai của mỗi lần học
            // messageError: mảng lưu lỗi sai
            stats[cardKey] = { attempts: {}, messageError: [] };
        }

        // lưu dữ liệu mới
        // nếu có lỗi thì lưu vào messageError, ngược lại lưu số lần sai vào attempts
        if (err1 || err2) {
            stats[cardKey].messageError.push({ err1, err2, hint });
        }
        else {
            stats[cardKey].attempts[time] = (stats[cardKey].attempts[time] || 0) + value;
            if (Object.keys(stats[cardKey].attempts).length > MAX_ATTEMPTS_PER_CARD) {
                const sortedAttempts = Object.entries(stats[cardKey].attempts)
                    .sort((a, b) => new Date(b[0]) - new Date(a[0]))
                    .slice(0, MAX_ATTEMPTS_PER_CARD);
                stats[cardKey].attempts = Object.fromEntries(sortedAttempts);
            }
        }

        localStorage.setItem("cardStats", JSON.stringify(stats));
    });
    
    function similarity(a, b) {
        let match = 0;
        const len = Math.min(a.length, b.length);

        for (let i = 0; i < len; i++) {
            if (a[i] === b[i]) match++;
        }

        return match;
    }

    (function () {
        try {
            XuatLog(0, "Card loaded...");
            // số lần sai để hiển thị đáp án
            const SHOW_ANSWER_THRESHOLD = 10;
            const DATEMODE = "dateMode";
            const GOOD = "good";
            if (!raw) {
                throw new Error("Mặt trước trống, không có gì để học cả!");
            }
            XuatLog(0, "Raw:" + JSON.stringify(raw));
            var time = new Date();
            time = TaoNgay(new Date("2020-01-1"), new Date("2026-05-26"));
            // time = Date.now();
            localStorage.setItem("lastCardTime", time);
            XuatLog(0, "Time for stats:" + JSON.stringify(time));

            // lấy element input, result, hint để thao tác
            const input = document.getElementById("myInput");
            // element hiển thị kết quả đúng/sai
            const result = document.getElementById("result");
            // element hiển thị gợi ý
            const hint = document.getElementById("hint");

            function handle() {
                XuatLog(0, "<strong>Handling user input...</strong>");
                const userInput = input.value;

                if (!userInput.trim()) {
                    hint.innerHTML = "⚠️ Vui lòng nhập đáp án";
                    input.focus();
                    return;
                }

                if (isCorrect(userInput, answers)) {
                    result.innerHTML = "✅ PASS";

                    // chỉ lưu nếu sai hoặc lần đầu (để có dữ liệu cải thiện)
                    if (fail > 0 || isFirst) {
                        saveStats(time, fail, "", "", "");
                        localStorage.setItem(GOOD, false);
                    }

                    if (fail === 0 && isFirst) {
                        // nếu đã pass thì xóa khỏi danh sách từ đang fail
                        localStorage.setItem(GOOD, true);
                    }

                    // reset
                    fail = 0;
                    // sau lần nhập đầu tiên, các lần sau sẽ không còn là "lần đầu" nữa
                    isFirst = false;
                    // ẩn gợi ý
                    hint.innerHTML = "";

                    // focus vào nút submit để lần sau nhấn Enter sẽ dễ dàng submit tiếp
                    document.getElementById("submitBtn").focus();
                } else {
                    // đánh dấu không phải lần đầu nếu đã nhập sai ít nhất 1 lần
                    isFirst = false;
                    result.innerHTML = "❌ NOT PASS";
                    // tăng số lần sai
                    fail++;
                    // tạo gợi ý từng chữ dựa trên input của user và đáp án đúng
                    let html = "";
                    // tính tổng lỗi để đánh giá mức độ sai của input của user
                    let totalError = 0;
                    // tách input của user theo dấu ";" để hỗ trợ nhiều đáp án cùng lúc
                    const userParts = userInput.split(";");

                    /** Duyệt qua từng đáp án đúng để tạo gợi ý từng chữ dựa trên phần đã nhập đúng của input của user và phần tương ứng của đáp án đúng
                     * - với mỗi đáp án, tìm phần nào của đáp án mà user đã nhập đúng để hiển thị gợi ý
                     * - tính tổng lỗi để đánh giá mức độ sai của input của user
                     */
                    answers.forEach(ansObj => {

                        let ans = ansObj.roma;

                        if (containsKanji(userInput)) {
                            ans = ansObj.kanji;
                        }
                        else if (containsJapanese(userInput)) {
                            ans = ansObj.hira;
                        }

                        let bestMatch = "";
                        let bestScore = -1;

                        userParts.forEach(p => {

                            let score = similarity(
                                Normalize(p),
                                Normalize(ans)
                            );

                            if (score > bestScore) {
                                bestScore = score;
                                bestMatch = p;
                            }
                        });

                        const user = bestMatch || "";

                        totalError += countErrors(user, ans);

                        html += generateMask(user, ans) + "<br>";
                    });

                    // nếu tổng lỗi lớn hơn hoặc bằng threshold thì hiển thị đáp án đầy đủ trong gợi ý, ngược lại hiển thị gợi ý từng chữ
                    if (fail >= SHOW_ANSWER_THRESHOLD) {
                        // hiển thị đáp án đầy đủ trong gợi ý
                        hint.innerHTML = `
                    <div class="answer-hint">
                        💡 ${answers.map(a => a.roma).join("; ")}
                    </div>
                    <div class="hint-sub">
                        Nhập lại để nhớ nhé
                    </div>
                `;
                    } else {
                        // hiển thị gợi ý từng chữ dựa trên phần đã nhập đúng của input của user và phần tương ứng của đáp án đúng
                        hint.innerHTML = html;
                    }

                    // reset input
                    input.value = "";
                    // focus và select để người dùng có thể nhập tiếp ngay
                    input.focus();
                    // chọn toàn bộ nội dung trong input để người dùng có thể nhập lại dễ dàng
                    input.select();

                    // lưu lỗi vào messageError để cải thiện gợi ý sau này
                    saveStats(time, fail, answers.map(a => a.roma).join("; "), userInput, html.replace(/<span class="correct">/g, "").replace(/<\/span>/g, "").replace(/<span class="missing">/g, ""));
                }

                if (isShowingAnswer) {
                    // lưu lỗi vào messageError để cải thiện gợi ý sau này
                    saveStats(time, ail, `Tôi đã quên từ này hãy giúp tôi nhớ`, "", "");
                    // reset lại trạng thái đã show đáp án để lần sau sẽ không show nữa
                    isShowingAnswer = false;
                }
            }

            // gán sự kiện cho nút submit
            document.getElementById("submitBtn").onclick = handle;
            // gợi ý sẽ hiển thị đáp án và tăng số lần sai lên để lần sau sẽ show luôn đáp án
            document.getElementById("showBtn").onclick = () => {
                // hiển thị đáp án
                hint.innerHTML = `
                <div class="answer-hint">
                    💡 ${answers.map(a => a.roma).join("; ")}
                </div>
            `;
                // đánh dấu đã show đáp án để lần sau sẽ show luôn
                isShowingAnswer = true;
                // tăng số lần sai lên để lần sau sẽ show luôn đáp án
                fail += SHOW_ANSWER_THRESHOLD;

                // reset input
                input.value = "";
                // focus và select để người dùng có thể nhập tiếp ngay
                input.focus();
                // chọn toàn bộ nội dung trong input để người dùng có thể nhập lại dễ dàng
                input.select();
            };
            // gán sự kiện cho input để khi nhấn Enter sẽ submit
            input.addEventListener("keydown", e => { if (e.key === "Enter") handle(); });
            // khi focus vào input thì tự động chọn toàn bộ nội dung để người dùng có thể nhập lại dễ dàng
            input.addEventListener("focus", () => input.select());

            // Xử lý hiển thị chỉ phần từ trong đáp án
            const answerDiv = document.querySelector('.answer');
            if (answerDiv) {
                const fullText = answerDiv.textContent;
                const word = fullText.split(' - ')[0];
                answerDiv.textContent = word;
            }

            // focus vào input khi mở card và chọn toàn bộ nội dung để người dùng có thể nhập ngay
            setTimeout(() => { input.focus(); input.select(); }, 100);
            setTimeout(() => {
                const cbHanTu = document.getElementById('cbDateMode');

                cbHanTu.checked = localStorage.getItem(DATEMODE) === "true";

                cbHanTu.addEventListener('change', (event) => {
                    localStorage.setItem(DATEMODE, event.target.checked);
                });

            }, 0);
        }
        catch (error) {
            XuatLog(2, "Error in card script:", error);
        }
    })();
</script>
