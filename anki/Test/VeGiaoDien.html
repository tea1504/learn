<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container">
        <h1>Test</h1>
        <div id="analytics"></div>
    </div>

</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

<script>
    var analytics = document.getElementById('analytics');

    function renderAnalytics(analytics = document.getElementById('')) {
        var div = document.createElement('div');

        div.innerText = "Đây là nội dung của analytics";

        if (!div.classList.contains("card")) {
            div.classList.add("card")
        }

        analytics.appendChild(div);

        return analytics;
    }

    (function () {
        try {
            analytics = renderAnalytics(analytics);
        }
        catch (e) {
            alert("Đã có lỗi xảy ra khi render analytics: " + e.message);
        }
    })();
</script>
